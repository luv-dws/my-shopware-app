version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopware_app
    user: "www-data:www-data"
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/shopware
      - APP_URL=http://localhost:8000
    networks:
      - shopware-net

  db:
    image: mysql:8.0
    container_name: shopware_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopware
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - shopware-net

  redis:
    image: redis:alpine
    container_name: shopware_redis
    ports:
      - "6379:6379"
    networks:
      - shopware-net

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - shopware-net

volumes:
  db_data:

networks:
  shopware-net:
    driver: bridge